apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gpa-ingress
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/rate-limit: "30"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  tls:
    - hosts:
        - your-domain.com
      secretName: gpa-tls
  rules:
    - host: your-domain.com
      http:
        paths:
          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: gpa-server
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gpa-server
                port:
                  number: 3000
