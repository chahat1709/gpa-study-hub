apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpa-server
  labels:
    app: gpa-server
spec:
  replicas: 3
  selector:
    matchLabels:
      app: gpa-server
  template:
    metadata:
      labels:
        app: gpa-server
    spec:
      containers:
        - name: gpa-server
          image: gpa-study-hub:latest
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: "production"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: gpa-secrets
                  key: database-url
            - name: REDIS_URL
              value: "redis://gpa-redis:6379"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gpa-secrets
                  key: jwt-secret
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: gpa-server
spec:
  selector:
    app: gpa-server
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: gpa-server-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: gpa-server
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
