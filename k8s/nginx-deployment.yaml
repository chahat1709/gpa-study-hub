apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpa-nginx
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gpa-nginx
  template:
    metadata:
      labels:
        app: gpa-nginx
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
            - containerPort: 443
          volumeMounts:
            - name: nginx-config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "100m"
      volumes:
        - name: nginx-config
          configMap:
            name: nginx-config
---
apiVersion: v1
kind: Service
metadata:
  name: gpa-nginx
spec:
  selector:
    app: gpa-nginx
  ports:
    - port: 80
      targetPort: 80
    - port: 443
      targetPort: 443
  type: LoadBalancer
