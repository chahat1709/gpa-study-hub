apiVersion: apps/v1
kind: Deployment
metadata:
  name: gpa-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gpa-redis
  template:
    metadata:
      labels:
        app: gpa-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
          ports:
            - containerPort: 6379
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: gpa-redis
spec:
  selector:
    app: gpa-redis
  ports:
    - port: 6379
      targetPort: 6379
