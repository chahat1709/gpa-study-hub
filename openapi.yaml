openapi: 3.1.0
info:
  title: GPA Study Hub API
  version: 1.0.0
  description: GTU academic platform — auth, academic, attendance, AI. Single source of truth for `apiClient.ts` and server.
servers:
  - url: http://localhost:3000
    description: Local (college PC / Docker)
  - url: https://api.gpashub.example.com
    description: Production (k8s + nginx)
security:
  - bearerAuth: []
paths:
  /api/health:
    get:
      summary: Health
      security: []
      responses:
        '200':
          {
            description: ok,
            content:
              {
                application/json:
                  {
                    schema:
                      {
                        type: object,
                        properties: { status: { type: string }, uptime: { type: integer } },
                      },
                  },
              },
          }
  /api/auth/signup:
    post:
      summary: Student signup
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, enrollmentNumber, pin]
              properties:
                name: { type: string, minLength: 2 }
                enrollmentNumber: { type: string, pattern: '^[A-Za-z0-9/-]+$' }
                pin: { type: string, pattern: '^\\d{4,8}$' }
                branch: { type: string, enum: [EC, ICT] }
                semester: { type: string, enum: ['1', '2', '3', '4', '5', '6'] }
      responses:
        '201': { description: created }
        '400': { description: validation error }
        '409': { description: already registered }
  /api/auth/login:
    post:
      summary: Student login
      security: []
      requestBody:
        required: true
        content:
          {
            application/json:
              {
                schema:
                  {
                    type: object,
                    required: [enrollmentNumber, pin],
                    properties: { enrollmentNumber: { type: string }, pin: { type: string } },
                  },
              },
          }
      responses:
        '200': { description: ok }
        '401': { description: invalid }
  /api/academic/subjects:
    get:
      parameters:
        - { name: branch, in: query, schema: { type: string, enum: [EC, ICT] } }
        - { name: semester, in: query, schema: { type: string } }
      responses: { '200': { description: ok } }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer, bearerFormat: JWT }
