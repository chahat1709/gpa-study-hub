name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install frontend deps
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Unit tests (155)
        run: npm test

      - name: Production build
        run: npm run build

      - name: Audit (high only, non-blocking)
        run: npm audit --audit-level=high || true

      - name: Upload dist artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  server:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install server deps
        run: npm ci

      - name: Health check (with required env)
        env:
          JWT_SECRET: ci-test-secret-must-be-64-chars-long-for-testing-purposes-12345678
          ADMIN_CODE: CI-ADMIN-CODE
          NODE_ENV: test
        run: |
          timeout 10 bash -c 'node server.js & pid=$!; sleep 5; curl -f http://localhost:3000/api/health; curl -f http://localhost:3000/api/academic/meta; kill $pid; wait $pid || true'

      - name: Server audit
        run: npm audit --audit-level=high || true
