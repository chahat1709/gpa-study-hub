appId: com.gpastudyhub.desktop
productName: GPA Study Hub
artifactName: GPA-Study-Hub-Setup-${version}-${arch}.${ext}
directories:
  output: release-installer
files:
  - desktop/**/*
  - dist/**/*
  - package.json
win:
  target:
    - nsis
  icon: public/gpa_hub_logo.png
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: GPA Study Hub
